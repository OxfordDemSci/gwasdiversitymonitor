# Docker Compose services for the Flask app, nginx reverse proxy, data
# collector, and self-hosted analytics.

services:

  nginx:
    container_name: gwas_nginx
    image: nginx:latest
    volumes:
      - ./:/var/www
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    networks:
      - my-network
    depends_on:
      - flask
      - goatcounter
    restart: unless-stopped

  flask:
    container_name: gwas_flask
    build:
      context: ./
      dockerfile: deploy/flask.Dockerfile
    command: gunicorn --config gunicorn_config.py wsgi:app
    volumes:
      - ./:/var/www
      - ./data:/app/data
    environment:
      GOATCOUNTER_URL: ${GOATCOUNTER_URL-https://stats.gwasdiversitymonitor.com}
      GWAS_DEPLOYMENT_DOMAIN: ${GWAS_DEPLOYMENT_DOMAIN:-}
      GWAS_NOINDEX: ${GWAS_NOINDEX:-}
    networks:
      my-network:
        aliases:
          - flask-app
    restart: unless-stopped

  goatcounter:
    container_name: gwas_goatcounter
    image: arp242/goatcounter:2.7.0
    environment:
      GOATCOUNTER_LISTEN: ":8080"
    volumes:
      - goatcounter-data:/home/goatcounter/goatcounter-data
    networks:
      - my-network
    restart: unless-stopped

  data:
    container_name: gwas_data
    build:
      context: ./
      dockerfile: deploy/data.Dockerfile
    command: ["python3", "generate_data.py"]
    volumes:
      - ./data:/app/data
      - ./app/logging:/app/app/logging
    environment:
      GWAS_DEPLOYMENT_DOMAIN: ${GWAS_DEPLOYMENT_DOMAIN:-}
      GWAS_LOCAL_MAIL_HOST: 127.0.0.1
      GWAS_LOCAL_MAIL_PORT: 25
      GWAS_FAILURE_EMAIL_FROM: ${GWAS_FAILURE_EMAIL_FROM:-alerts@mail.gwasdiversitymonitor.com}
      GWAS_FAILURE_EMAIL_TO: ${GWAS_FAILURE_EMAIL_TO:-contact@gwasdiversitymonitor.com}
      GWAS_FAILURE_EMAIL_COOLDOWN_SECONDS: ${GWAS_FAILURE_EMAIL_COOLDOWN_SECONDS:-21600}
    # The production job reaches only the host's loopback-bound mail transfer
    # agent. No SMTP account or credential is passed into the container.
    network_mode: host
    restart: on-failure

networks:
  my-network:

volumes:
  goatcounter-data:
    name: gwas_goatcounter_data
