<dialog class="popup-container" id="popup-download-image" aria-labelledby="popup-image-title">
	<div class="popup-background" onclick="hidePopup('popup-download-image');"></div>
	<div class="popup-box">
		<button type="button" class="popup-close" onclick="hidePopup('popup-download-image');"
		        aria-label="Close image export" autofocus>&times;</button>
		<h2 id="popup-image-title">Export chart image and data</h2>
		<div class="popup-export-actions">
			<button type="button" id="button_svg" class="btn">SVG + matching data (.zip)</button>
			<button type="button" id="button_png" class="btn">PNG + matching data (.zip)</button>
		</div>
	</div>
</dialog>
