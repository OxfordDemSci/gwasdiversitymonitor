<section class="funder-toolbar" aria-label="Dashboard filters">
    <div class="funder-toolbar__field">
        <label for="funder-filter">Funder</label>
        <select id="funder-filter" aria-label="Filter dashboard by funder"
                multiple disabled></select>
    </div>
    <div class="funder-toolbar__field">
        <label for="dataset-filter">Cohort</label>
        <select id="dataset-filter" aria-label="Filter dashboard by cohort"
                multiple disabled></select>
    </div>
    <span id="funder-status" class="funder-toolbar__status" aria-live="polite">
        All published GWAS
    </span>
    <div class="funder-toolbar__actions">
        <a id="funder-data-download" class="funder-toolbar__action is-disabled"
           aria-disabled="true" title="Download selected data">
            <i class="icon-download-data" aria-hidden="true"></i>
            <span>Data</span>
        </a>
        <a id="funder-report-link" class="funder-toolbar__action is-disabled"
           aria-disabled="true" title="Open selection report">
            <span>Report</span>
        </a>
    </div>
</section>
