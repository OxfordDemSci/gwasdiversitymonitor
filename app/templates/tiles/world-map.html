<div class="world-map-header">
    <h3>
        <span class="metric-title">Participants</span> by country (all parent
        terms summed across studies)
    </h3>
    <small><span class="stage-title">Discovery</span> Stage</small>
</div>
<div class="world-map-footer">
    <div class="world-map-change-year">
        <button type="button" class="previous icon" onclick="wmfirstYear()" aria-label="First world-map year">
            <i class="icon-double-chevron-left" aria-hidden="true"></i>
        </button>
        <button type="button" class="previous icon" onclick="wmpreviousYear()" aria-label="Previous world-map year">
            <i class="icon-chevron-left" aria-hidden="true"></i>
        </button>
        <span aria-live="polite" aria-label="World-map year"></span>
        <button type="button" class="next icon" onclick="wmnextYear()" aria-label="Next world-map year">
            <i class="icon-chevron-right" aria-hidden="true"></i>
        </button>
        <button type="button" class="next icon" onclick="wmlastestYear()" aria-label="Latest world-map year">
            <i class="icon-double-chevron-right" aria-hidden="true"></i>
        </button>
    </div>
    <div class="world-map-header-actions">
        <div class="world-map-zoom-controls">
            <button class="three-icons icon" type="button" onclick="wmZoomIn()" aria-label="Zoom map in" title="Zoom in">
                <i class="icon-zoom-out" aria-hidden="true"></i>
            </button>
            <button class="three-icons icon" type="button" onclick="wmResetZoom()" aria-label="Reset map zoom" title="Reset zoom">
                <i class="icon-full-screen" aria-hidden="true"></i>
            </button>
            <button class="three-icons icon" type="button" onclick="wmZoomOut()" aria-label="Zoom map out" title="Zoom out">
                <i class="icon-zoom-in" aria-hidden="true"></i>
            </button>
        </div>
        {% with filename='choro_df', id='world-map-controls' %} {% include
        'components/three-icons.html' %} {% endwith %}
    </div>
</div>
