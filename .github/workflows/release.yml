name: Build and deploy a branch release

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to this branch's environment (dev=staging, main=production)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: immutable-release-${{ github.ref }}
  # Never terminate an SSH rollout halfway through. Newer pending pushes may
  # supersede older pending pushes; each deploy also checks the branch tip.
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'OxfordDemSci/gwasdiversitymonitor'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      - name: Select only this branch's deployment
        id: target
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          MANUAL_DEPLOY: ${{ inputs.deploy }}
          DEV_ENABLED: ${{ vars.GWAS_DEPLOY_DEV_ENABLED }}
          MAIN_ENABLED: ${{ vars.GWAS_DEPLOY_MAIN_ENABLED }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/heads/dev) ENABLED="$DEV_ENABLED" ;;
            refs/heads/main) ENABLED="$MAIN_ENABLED" ;;
            *) echo "Only the dev and main branches can build releases" >&2; exit 1 ;;
          esac
          DEPLOY=false
          if [ "$EVENT" = workflow_dispatch ] && [ "$MANUAL_DEPLOY" = true ]; then
            DEPLOY=true
          elif [ "$EVENT" = push ] && [ "$ENABLED" = true ]; then
            DEPLOY=true
          fi
          printf 'deploy=%s\n' "$DEPLOY" >> "$GITHUB_OUTPUT"
          printf 'Branch: %s; deploy: %s\n' "$REF" "$DEPLOY"
  tests:
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      skip_container_builds: true
  images:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      commit: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: flask
        with:
          context: .
          file: deploy/flask.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/oxforddemsci/gwasdiversitymonitor-flask:${{ github.sha }}
          build-args: GWAS_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=flask-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=flask-${{ github.ref_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: data
        with:
          context: .
          file: deploy/data.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/oxforddemsci/gwasdiversitymonitor-data:${{ github.sha }}
          build-args: GWAS_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=data-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=data-${{ github.ref_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: nginx
        with:
          context: .
          file: deploy/nginx.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/oxforddemsci/gwasdiversitymonitor-nginx:${{ github.sha }}
          build-args: GWAS_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=nginx-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=nginx-${{ github.ref_name }}
      - name: Record the exact image digests
        env:
          COMMIT: ${{ github.sha }}
          FLASK: ${{ steps.flask.outputs.digest }}
          DATA: ${{ steps.data.outputs.digest }}
          NGINX: ${{ steps.nginx.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          release = {'version': 1, 'commit': os.environ['COMMIT'], 'images': {
              name: 'ghcr.io/oxforddemsci/gwasdiversitymonitor-' + name + '@' + os.environ[name.upper()]
              for name in ('flask', 'data', 'nginx')}}
          with open('release.json', 'w') as stream:
              json.dump(release, stream, indent=2)
          PY
          python deploy/release.py validate release.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.sha }}
          path: release.json
          if-no-files-found: error
          retention-days: 90
  staging:
    if: needs.guard.outputs.deploy == 'true' && github.ref == 'refs/heads/dev'
    needs: [guard, images]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: staging
      url: https://dev.gwasdiversitymonitor.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ github.sha }}
      - name: Deploy staging and verify the public commit and job heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DOMAIN: dev.gwasdiversitymonitor.com
        run: |
          set -euo pipefail
          LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "Superseded by a newer branch tip; not deploying $GITHUB_SHA"
            exit 0
          fi
          bash deploy/remote_release.sh release.json
          python deploy/monitor.py https://dev.gwasdiversitymonitor.com --expected-commit "$GITHUB_SHA"
  production:
    if: needs.guard.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    needs: [guard, images]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://gwasdiversitymonitor.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ github.sha }}
      - name: Deploy main only to production and check the public release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DOMAIN: gwasdiversitymonitor.com
        run: |
          set -euo pipefail
          LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "Superseded by a newer branch tip; not deploying $GITHUB_SHA"
            exit 0
          fi
          bash deploy/remote_release.sh release.json
          python deploy/monitor.py https://gwasdiversitymonitor.com --expected-commit "$GITHUB_SHA"
