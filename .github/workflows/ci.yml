name: Dashboard tests

on:
  push:
    branches: [dev, master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_container_builds:
        description: The release workflow builds and publishes these images next
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dashboard-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GWAS_NOINDEX: '1'
      GOATCOUNTER_URL: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Python tests with isolated synthetic data and configuration
        run: python tests/browser/run_unit_tests.py
      - name: JavaScript unit tests
        run: node --test tests/js/*.test.cjs
      - name: Browser flows and cold-load regression budgets
        run: python tests/browser/run_browser_tests.py --artifacts artifacts/browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser
          if-no-files-found: ignore
          retention-days: 7

  containers:
    if: ${{ !inputs.skip_container_builds }}
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [flask, data, nginx]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build release image without publishing or deploying
        run: >-
          docker build --build-arg GWAS_BUILD_SHA="$GITHUB_SHA"
          --file "deploy/${{ matrix.image }}.Dockerfile"
          --tag "gwas-ci-${{ matrix.image }}:$GITHUB_SHA" .
