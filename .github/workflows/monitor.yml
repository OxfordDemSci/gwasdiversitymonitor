name: Check public website and data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
jobs:
  health:
    # Off until operators explicitly configure notification delivery and enable it.
    if: vars.GWAS_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        site: [gwasdiversitymonitor.com, dev.gwasdiversitymonitor.com]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check availability, integrity and data-job heartbeat
        env:
          SITE: ${{ matrix.site }}
        run: python3 deploy/monitor.py "https://$SITE"
