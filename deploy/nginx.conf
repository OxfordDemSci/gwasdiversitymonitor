# nginx server and proxy settings

upstream flask-app {
    server flask:8000;
}

upstream goatcounter-app {
    server goatcounter:8080;
}

# Lightsail distributions terminate HTTPS and can forward the viewer protocol
# in this header. Direct requests fall back to the protocol nginx received.
map $http_cloudfront_forwarded_proto $viewer_protocol {
    default $scheme;
    http http;
    https https;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name gwasdiversitymonitor.com www.gwasdiversitymonitor.com _;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/javascript
        text/plain;
    location / {
        proxy_pass http://flask-app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $viewer_protocol;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name stats.gwasdiversitymonitor.com;

    location / {
        proxy_pass http://goatcounter-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $viewer_protocol;
        proxy_set_header Scheme $viewer_protocol;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}
