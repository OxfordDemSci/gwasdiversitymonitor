# nginx server and proxy settings

upstream flask-app {
    server flask:8000;
}

server {
    listen 80;
    server_name _;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/javascript
        text/plain;
    location / {
        proxy_pass http://flask-app;
        # proxy_set_header Host "localhost";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
