# nginx server and proxy settings

upstream flask-app {
    server flask:8000;
}

upstream goatcounter-app {
    server goatcounter:8080;
}

# Lightsail distributions terminate HTTPS and can forward the viewer protocol
# in this header. Direct requests fall back to the protocol nginx received.
map $http_cloudfront_forwarded_proto $viewer_protocol {
    default $scheme;
    http http;
    https https;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Static URLs emitted by versioned_static() carry the file's nanosecond mtime.
# Those URLs (and content-hashed filenames) can be cached indefinitely; plain
# URLs must revalidate so local/development edits are never hidden by a stale
# browser cache.
map "$uri:$arg_v" $static_cache_control {
    "~\.[0-9a-f]{12,64}\.[A-Za-z0-9]+:$" "public, max-age=31536000, immutable";
    "~:[0-9]{10,20}$"                      "public, max-age=31536000, immutable";
    default                                "public, max-age=0, must-revalidate";
}

server {
    listen 80 default_server;
    server_name gwasdiversitymonitor.com www.gwasdiversitymonitor.com _;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/javascript
        text/plain;

    # Serve application assets in nginx rather than spending a Gunicorn worker
    # on every stylesheet, script, font, and image request.  The repository is
    # mounted at /var/www by docker-compose.yml.
    location ^~ /static/ {
        root /var/www/app;
        try_files $uri =404;

        etag on;
        # Without "always", nginx deliberately does not mark error responses
        # immutable (for example, a temporarily missing versioned asset).
        add_header Cache-Control $static_cache_control;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://flask-app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $viewer_protocol;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name stats.gwasdiversitymonitor.com;

    location / {
        proxy_pass http://goatcounter-app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $viewer_protocol;
        proxy_set_header Scheme $viewer_protocol;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}
